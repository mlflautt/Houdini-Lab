{
  "id": "sop.vellum_membrane_lab",
  "version": "1.0.0",
  "summary": "Build three bounded pinned Vellum membrane candidates with silk, rubber, and surface-strut reinforcement profiles.",
  "contexts": ["SOP"],
  "inputs": {
    "parent_path": {"type": "string"},
    "run_code": {"type": "string", "default": "VELLUM_MEMBRANE"},
    "lineage": {"type": "string", "default": "native Vellum membrane lab; Houdini 22.0.368"},
    "resolution": {"type": "integer", "min": 9, "max": 41, "default": 25},
    "sheet_size": {"type": "number", "min": 1.0, "max": 5.0, "default": 2.4},
    "sheet_height": {"type": "number", "min": 1.5, "max": 6.0, "default": 2.5},
    "anchor_z": {"type": "number", "min": 0.5, "max": 2.5, "default": 1.2},
    "noise_height": {"type": "number", "min": 0.0, "max": 0.12, "default": 0.035},
    "noise_element_size": {"type": "number", "min": 0.1, "max": 2.0, "default": 0.45},
    "seed_silk": {"type": "integer", "min": 0, "max": 2147483647, "default": 1313},
    "seed_rubber": {"type": "integer", "min": 0, "max": 2147483647, "default": 1414},
    "seed_reinforced": {"type": "integer", "min": 0, "max": 2147483647, "default": 1515},
    "mass": {"type": "number", "min": 0.001, "max": 2.0, "default": 0.08},
    "thickness": {"type": "number", "min": 0.002, "max": 0.1, "default": 0.025},
    "substeps": {"type": "integer", "min": 1, "max": 5, "default": 2},
    "constraint_iterations": {"type": "integer", "min": 10, "max": 150, "default": 60},
    "smoothing_iterations": {"type": "integer", "min": 0, "max": 30, "default": 5},
    "gravity_y": {"type": "number", "min": -30.0, "max": 0.0, "default": -9.80665},
    "wind_x": {"type": "number", "min": -10.0, "max": 10.0, "default": 0.7},
    "wind_z": {"type": "number", "min": -10.0, "max": 10.0, "default": 0.2},
    "wind_speed": {"type": "number", "min": 0.0, "max": 10.0, "default": 1.0},
    "wind_drag": {"type": "number", "min": 0.0, "max": 2.0, "default": 0.08},
    "collider_radius": {"type": "number", "min": 0.25, "max": 2.0, "default": 0.75},
    "start_frame": {"type": "integer", "min": 1, "max": 100000, "default": 1},
    "end_frame": {"type": "integer", "min": 1, "max": 100000, "default": 24},
    "cache_silk": {"type": "string", "default": "$JOB/cache/vellum_membrane/silk.$F4.bgeo.sc"},
    "cache_rubber": {"type": "string", "default": "$JOB/cache/vellum_membrane/rubber.$F4.bgeo.sc"},
    "cache_reinforced": {"type": "string", "default": "$JOB/cache/vellum_membrane/reinforced.$F4.bgeo.sc"},
    "candidate_index": {"type": "integer", "min": 0, "max": 2, "default": 0}
  },
  "references": {
    "sidefx_constraints": "https://www.sidefx.com/docs/houdini/nodes/sop/vellumconstraints.html",
    "sidefx_solver": "https://www.sidefx.com/docs/houdini/nodes/sop/vellumsolver.html"
  },
  "nodes": [
    {"id": "grid", "type": "grid", "name": "{{run_code}}_MEMBRANE_GRID", "role": "membrane_shared_grid", "position": [0, 22], "params": {"orient": "zx", "sizex": "{{sheet_size}}", "sizey": "{{sheet_size}}", "rows": "{{resolution}}", "cols": "{{resolution}}", "ty": "{{sheet_height}}"}, "comment": "{{lineage}}; shared editable polygon membrane"},
    {"id": "anchors", "type": "groupcreate", "name": "{{run_code}}_ANCHOR_EDGE", "role": "membrane_anchor_group", "position": [0, 20], "params": {"groupname": "anchors", "grouptype": "point", "groupbase": 0, "groupbounding": 1, "boundtype": "usebbox", "sizex": 6.0, "sizey": 1.0, "sizez": 0.12, "tx": 0.0, "ty": "{{sheet_height}}", "tz": "{{anchor_z}}"}, "comment": "Top edge anchor group; bounding selection is explicit and selection-independent"},

    {"id": "silk_noise", "type": "mountain::2.0", "name": "{{run_code}}_SILK_SEEDED_REST", "role": "membrane_seeded_rest_silk", "position": [-10, 18], "params": {"height": "{{noise_height}}", "elementsize": "{{noise_element_size}}", "offsetx": "{{seed_silk}}", "updatenmls": 0}, "comment": "Candidate silk; deterministic native symmetry break"},
    {"id": "silk_rest", "type": "null", "name": "OUT_{{run_code}}_SILK_REST", "role": "membrane_rest_silk", "position": [-10, 16], "params": {}, "comment": "Editable silk rest contract"},
    {"id": "silk_cloth", "type": "vellumconstraints", "name": "{{run_code}}_SILK_CLOTH", "role": "membrane_cloth_silk", "position": [-10, 14], "params": {"constrainttype": "cloth", "domass": "on", "mass": "{{mass}}", "dothickness": "on", "thickness": "{{thickness}}", "stretchstiffness": 1.0, "stretchstiffnessexp": 5, "bendstiffness": 1.0, "bendstiffnessexp": -3, "dragnormal": 1.0, "dragtangent": 0.05}, "comment": "Silk profile: strong stretch with very soft bend"},
    {"id": "silk_pin", "type": "vellumconstraints", "name": "{{run_code}}_SILK_PIN", "role": "membrane_pin_silk", "position": [-10, 12], "params": {"constrainttype": "pin", "grouptype": "points", "group": "anchors", "pingroup": "", "pintype": "hard", "matchanimation": 0}, "comment": "Permanent top-edge anchors; main Group field is the verified H22 contract"},
    {"id": "silk_constraints", "type": "null", "name": "OUT_{{run_code}}_SILK_CONSTRAINTS", "role": "membrane_constraints_silk", "position": [-8, 10], "params": {}, "comment": "Silk constraint geometry contract"},
    {"id": "silk_solver", "type": "vellumsolver", "name": "{{run_code}}_SILK_SOLVER", "role": "membrane_solver_silk", "position": [-10, 8], "params": {"startframe": "{{start_frame}}", "simulationtype": "dynamic", "substeps": "{{substeps}}", "niter": "{{constraint_iterations}}", "smoothiter": "{{smoothing_iterations}}", "gravityy": "{{gravity_y}}", "enablecollisions": 1, "doselfcollisions": 1, "autoresim": 1, "dowind": 1, "windx": "{{wind_x}}", "windz": "{{wind_z}}", "windspeed": "{{wind_speed}}", "winddrag": "{{wind_drag}}"}, "comment": "Independent bounded silk solve"},
    {"id": "silk_raw", "type": "null", "name": "OUT_{{run_code}}_SILK_SIM_RAW", "role": "membrane_raw_silk", "position": [-10, 6], "params": {}, "comment": "Uncached silk simulation"},
    {"id": "silk_cache", "type": "filecache", "name": "{{run_code}}_SILK_FILE_CACHE", "role": "membrane_cache_silk", "position": [-10, 4], "params": {"file": "{{cache_silk}}", "trange": "normal", "f1": "{{start_frame}}", "f2": "{{end_frame}}", "f3": 1, "initsim": 1, "loadfromdisk": 0}, "comment": "Configured only; never saved implicitly"},
    {"id": "silk_out", "type": "null", "name": "OUT_{{run_code}}_SILK", "role": "membrane_candidate_silk", "position": [-10, 2], "params": {}, "comment": "Editable simulated silk candidate"},

    {"id": "rubber_noise", "type": "mountain::2.0", "name": "{{run_code}}_RUBBER_SEEDED_REST", "role": "membrane_seeded_rest_rubber", "position": [0, 18], "params": {"height": "{{noise_height}}", "elementsize": "{{noise_element_size}}", "offsetx": "{{seed_rubber}}", "updatenmls": 0}, "comment": "Candidate rubber; deterministic native symmetry break"},
    {"id": "rubber_rest", "type": "null", "name": "OUT_{{run_code}}_RUBBER_REST", "role": "membrane_rest_rubber", "position": [0, 16], "params": {}, "comment": "Editable rubber rest contract"},
    {"id": "rubber_cloth", "type": "vellumconstraints", "name": "{{run_code}}_RUBBER_CLOTH", "role": "membrane_cloth_rubber", "position": [0, 14], "params": {"constrainttype": "cloth", "domass": "on", "mass": "{{mass}}", "dothickness": "on", "thickness": "{{thickness}}", "stretchstiffness": 2.0, "stretchstiffnessexp": 4, "bendstiffness": 1.0, "bendstiffnessexp": -1, "dragnormal": 1.0, "dragtangent": 0.05}, "comment": "Rubber profile: more compliant stretch with stronger bend"},
    {"id": "rubber_pin", "type": "vellumconstraints", "name": "{{run_code}}_RUBBER_PIN", "role": "membrane_pin_rubber", "position": [0, 12], "params": {"constrainttype": "pin", "grouptype": "points", "group": "anchors", "pingroup": "", "pintype": "hard", "matchanimation": 0}, "comment": "Permanent top-edge anchors"},
    {"id": "rubber_constraints", "type": "null", "name": "OUT_{{run_code}}_RUBBER_CONSTRAINTS", "role": "membrane_constraints_rubber", "position": [2, 10], "params": {}, "comment": "Rubber constraint geometry contract"},
    {"id": "rubber_solver", "type": "vellumsolver", "name": "{{run_code}}_RUBBER_SOLVER", "role": "membrane_solver_rubber", "position": [0, 8], "params": {"startframe": "{{start_frame}}", "simulationtype": "dynamic", "substeps": "{{substeps}}", "niter": "{{constraint_iterations}}", "smoothiter": "{{smoothing_iterations}}", "gravityy": "{{gravity_y}}", "enablecollisions": 1, "doselfcollisions": 1, "autoresim": 1, "dowind": 1, "windx": "{{wind_x}}", "windz": "{{wind_z}}", "windspeed": "{{wind_speed}}", "winddrag": "{{wind_drag}}"}, "comment": "Independent bounded rubber solve"},
    {"id": "rubber_raw", "type": "null", "name": "OUT_{{run_code}}_RUBBER_SIM_RAW", "role": "membrane_raw_rubber", "position": [0, 6], "params": {}, "comment": "Uncached rubber simulation"},
    {"id": "rubber_cache", "type": "filecache", "name": "{{run_code}}_RUBBER_FILE_CACHE", "role": "membrane_cache_rubber", "position": [0, 4], "params": {"file": "{{cache_rubber}}", "trange": "normal", "f1": "{{start_frame}}", "f2": "{{end_frame}}", "f3": 1, "initsim": 1, "loadfromdisk": 0}, "comment": "Configured only; never saved implicitly"},
    {"id": "rubber_out", "type": "null", "name": "OUT_{{run_code}}_RUBBER", "role": "membrane_candidate_rubber", "position": [0, 2], "params": {}, "comment": "Editable simulated rubber candidate"},

    {"id": "reinforced_noise", "type": "mountain::2.0", "name": "{{run_code}}_REINFORCED_SEEDED_REST", "role": "membrane_seeded_rest_reinforced", "position": [10, 18], "params": {"height": "{{noise_height}}", "elementsize": "{{noise_element_size}}", "offsetx": "{{seed_reinforced}}", "updatenmls": 0}, "comment": "Candidate reinforced; deterministic native symmetry break"},
    {"id": "reinforced_rest", "type": "null", "name": "OUT_{{run_code}}_REINFORCED_REST", "role": "membrane_rest_reinforced", "position": [10, 16], "params": {}, "comment": "Editable reinforced rest contract"},
    {"id": "reinforced_cloth", "type": "vellumconstraints", "name": "{{run_code}}_REINFORCED_CLOTH", "role": "membrane_cloth_reinforced", "position": [10, 14], "params": {"constrainttype": "cloth", "domass": "on", "mass": "{{mass}}", "dothickness": "on", "thickness": "{{thickness}}", "stretchstiffness": 1.0, "stretchstiffnessexp": 5, "bendstiffness": 1.0, "bendstiffnessexp": -2, "dragnormal": 1.0, "dragtangent": 0.05}, "comment": "Reinforced base cloth profile"},
    {"id": "reinforced_pin", "type": "vellumconstraints", "name": "{{run_code}}_REINFORCED_PIN", "role": "membrane_pin_reinforced", "position": [10, 12], "params": {"constrainttype": "pin", "grouptype": "points", "group": "anchors", "pingroup": "", "pintype": "hard", "matchanimation": 0}, "comment": "Permanent top-edge anchors"},
    {"id": "reinforced_struts", "type": "vellumconstraints", "name": "{{run_code}}_REINFORCED_SURFACE_STRUTS", "role": "membrane_surface_struts_reinforced", "position": [10, 10], "params": {"constrainttype": "surfacestruts", "strut_maxlen": 0.8, "strut_constraintsperpt": 2, "strut_jitter": 0.15, "strut_seed": "{{seed_reinforced}}", "stretchstiffness": 1.0, "stretchstiffnessexp": 4}, "comment": "Open-surface reinforcement; ordinary Struts produce no constraints on this membrane"},
    {"id": "reinforced_constraints", "type": "null", "name": "OUT_{{run_code}}_REINFORCED_CONSTRAINTS", "role": "membrane_constraints_reinforced", "position": [12, 8], "params": {}, "comment": "Cloth plus surface-strut constraint contract"},
    {"id": "reinforced_solver", "type": "vellumsolver", "name": "{{run_code}}_REINFORCED_SOLVER", "role": "membrane_solver_reinforced", "position": [10, 6], "params": {"startframe": "{{start_frame}}", "simulationtype": "dynamic", "substeps": "{{substeps}}", "niter": "{{constraint_iterations}}", "smoothiter": "{{smoothing_iterations}}", "gravityy": "{{gravity_y}}", "enablecollisions": 1, "doselfcollisions": 1, "autoresim": 1, "dowind": 1, "windx": "{{wind_x}}", "windz": "{{wind_z}}", "windspeed": "{{wind_speed}}", "winddrag": "{{wind_drag}}"}, "comment": "Independent bounded reinforced solve"},
    {"id": "reinforced_raw", "type": "null", "name": "OUT_{{run_code}}_REINFORCED_SIM_RAW", "role": "membrane_raw_reinforced", "position": [10, 4], "params": {}, "comment": "Uncached reinforced simulation"},
    {"id": "reinforced_cache", "type": "filecache", "name": "{{run_code}}_REINFORCED_FILE_CACHE", "role": "membrane_cache_reinforced", "position": [10, 2], "params": {"file": "{{cache_reinforced}}", "trange": "normal", "f1": "{{start_frame}}", "f2": "{{end_frame}}", "f3": 1, "initsim": 1, "loadfromdisk": 0}, "comment": "Configured only; never saved implicitly"},
    {"id": "reinforced_out", "type": "null", "name": "OUT_{{run_code}}_REINFORCED", "role": "membrane_candidate_reinforced", "position": [10, 0], "params": {}, "comment": "Editable simulated reinforced candidate"},

    {"id": "collider_sphere", "type": "sphere", "name": "{{run_code}}_COLLIDER_SPHERE", "role": "membrane_collider_sphere", "position": [-5, 12], "params": {"type": 2, "rad": ["{{collider_radius}}", "{{collider_radius}}", "{{collider_radius}}"], "freq": 5, "ty": "{{collider_radius}}"}, "comment": "Shared closed drape collider"},
    {"id": "collider_floor", "type": "box", "name": "{{run_code}}_COLLIDER_FLOOR", "role": "membrane_collider_floor", "position": [-5, 10], "params": {"size": [8.0, 0.2, 8.0], "ty": -0.1}, "comment": "Shared closed floor collider"},
    {"id": "collider_merge", "type": "merge", "name": "{{run_code}}_COLLIDER_MERGE", "role": "membrane_collider_merge", "position": [-5, 8], "params": {}, "comment": "Explicit sphere plus floor collider"},
    {"id": "collider", "type": "null", "name": "OUT_{{run_code}}_COLLIDER", "role": "membrane_collider_contract", "position": [-5, 6], "params": {}, "comment": "Shared third-input collider contract"},

    {"id": "selector", "type": "switch", "name": "{{run_code}}_SELECT_MEMBRANE", "role": "membrane_human_selector", "position": [0, -2], "params": {"input": "{{candidate_index}}"}, "comment": "Human preview choice; no winner implied"},
    {"id": "selected", "type": "null", "name": "OUT_{{run_code}}_SELECTED", "role": "membrane_selected_contract", "position": [0, -4], "params": {}, "comment": "Selected candidate contract; alternatives remain intact"},
    {"id": "silk_compare", "type": "xform", "name": "{{run_code}}_SILK_COMPARE", "role": "membrane_compare_silk", "position": [-6, -4], "params": {"tx": -3.2}, "comment": "Fixed comparison placement"},
    {"id": "rubber_compare", "type": "xform", "name": "{{run_code}}_RUBBER_COMPARE", "role": "membrane_compare_rubber", "position": [0, -6], "params": {"tx": 0.0}, "comment": "Fixed comparison placement"},
    {"id": "reinforced_compare", "type": "xform", "name": "{{run_code}}_REINFORCED_COMPARE", "role": "membrane_compare_reinforced", "position": [6, -4], "params": {"tx": 3.2}, "comment": "Fixed comparison placement"},
    {"id": "compare_merge", "type": "merge", "name": "{{run_code}}_COMPARE_MERGE", "role": "membrane_comparison_merge", "position": [0, -8], "params": {}, "comment": "Fixed order: silk, rubber, reinforced"},
    {"id": "compare_frame", "type": "xform", "name": "{{run_code}}_COMPARE_FRAME", "role": "membrane_comparison_frame", "position": [0, -10], "params": {"ty": -0.7, "scale": 0.58}, "comment": "Presentation-only camera framing"},
    {"id": "compare", "type": "null", "name": "OUT_{{run_code}}_COMPARE", "role": "membrane_comparison_contract", "position": [0, -12], "params": {}, "comment": "Three editable candidates; ratings empty; no automatic winner", "flags": {"display": true, "render": true}},

    {"id": "silk_label", "type": "font", "name": "{{run_code}}_SILK_LABEL", "role": "membrane_label_source_silk", "position": [-6, -8], "params": {"text": "SILK  seed {{seed_silk}}", "halign": "center", "valign": "middle", "fontsize": 0.22}, "comment": "Separate candidate label"},
    {"id": "silk_label_xform", "type": "xform", "name": "{{run_code}}_SILK_LABEL_LAYOUT", "role": "membrane_label_silk", "position": [-6, -10], "params": {"tx": -3.2, "ty": -0.45}, "comment": "Separate label layout"},
    {"id": "rubber_label", "type": "font", "name": "{{run_code}}_RUBBER_LABEL", "role": "membrane_label_source_rubber", "position": [0, -10], "params": {"text": "RUBBER  seed {{seed_rubber}}", "halign": "center", "valign": "middle", "fontsize": 0.22}, "comment": "Separate candidate label"},
    {"id": "rubber_label_xform", "type": "xform", "name": "{{run_code}}_RUBBER_LABEL_LAYOUT", "role": "membrane_label_rubber", "position": [0, -12], "params": {"tx": 0.0, "ty": -0.45}, "comment": "Separate label layout"},
    {"id": "reinforced_label", "type": "font", "name": "{{run_code}}_REINFORCED_LABEL", "role": "membrane_label_source_reinforced", "position": [6, -8], "params": {"text": "REINFORCED  seed {{seed_reinforced}}", "halign": "center", "valign": "middle", "fontsize": 0.22}, "comment": "Separate candidate label"},
    {"id": "reinforced_label_xform", "type": "xform", "name": "{{run_code}}_REINFORCED_LABEL_LAYOUT", "role": "membrane_label_reinforced", "position": [6, -10], "params": {"tx": 3.2, "ty": -0.45}, "comment": "Separate label layout"},
    {"id": "labels", "type": "merge", "name": "OUT_{{run_code}}_LABELS", "role": "membrane_labels_contract", "position": [6, -12], "params": {}, "comment": "Labels are intentionally excluded from render geometry"}
  ],
  "connections": [
    ["grid", 0, "anchors", 0],
    ["anchors", 0, "silk_noise", 0], ["silk_noise", 0, "silk_rest", 0], ["silk_rest", 0, "silk_cloth", 0], ["silk_cloth", 0, "silk_pin", 0], ["silk_cloth", 1, "silk_pin", 1], ["silk_pin", 1, "silk_constraints", 0], ["silk_pin", 0, "silk_solver", 0], ["silk_constraints", 0, "silk_solver", 1], ["collider", 0, "silk_solver", 2], ["silk_solver", 0, "silk_raw", 0], ["silk_raw", 0, "silk_cache", 0], ["silk_cache", 0, "silk_out", 0],
    ["anchors", 0, "rubber_noise", 0], ["rubber_noise", 0, "rubber_rest", 0], ["rubber_rest", 0, "rubber_cloth", 0], ["rubber_cloth", 0, "rubber_pin", 0], ["rubber_cloth", 1, "rubber_pin", 1], ["rubber_pin", 1, "rubber_constraints", 0], ["rubber_pin", 0, "rubber_solver", 0], ["rubber_constraints", 0, "rubber_solver", 1], ["collider", 0, "rubber_solver", 2], ["rubber_solver", 0, "rubber_raw", 0], ["rubber_raw", 0, "rubber_cache", 0], ["rubber_cache", 0, "rubber_out", 0],
    ["anchors", 0, "reinforced_noise", 0], ["reinforced_noise", 0, "reinforced_rest", 0], ["reinforced_rest", 0, "reinforced_cloth", 0], ["reinforced_cloth", 0, "reinforced_pin", 0], ["reinforced_cloth", 1, "reinforced_pin", 1], ["reinforced_pin", 0, "reinforced_struts", 0], ["reinforced_pin", 1, "reinforced_struts", 1], ["reinforced_struts", 1, "reinforced_constraints", 0], ["reinforced_struts", 0, "reinforced_solver", 0], ["reinforced_constraints", 0, "reinforced_solver", 1], ["collider", 0, "reinforced_solver", 2], ["reinforced_solver", 0, "reinforced_raw", 0], ["reinforced_raw", 0, "reinforced_cache", 0], ["reinforced_cache", 0, "reinforced_out", 0],
    ["collider_sphere", 0, "collider_merge", 0], ["collider_floor", 0, "collider_merge", 1], ["collider_merge", 0, "collider", 0],
    ["silk_out", 0, "selector", 0], ["rubber_out", 0, "selector", 1], ["reinforced_out", 0, "selector", 2], ["selector", 0, "selected", 0],
    ["silk_out", 0, "silk_compare", 0], ["rubber_out", 0, "rubber_compare", 0], ["reinforced_out", 0, "reinforced_compare", 0], ["silk_compare", 0, "compare_merge", 0], ["rubber_compare", 0, "compare_merge", 1], ["reinforced_compare", 0, "compare_merge", 2], ["compare_merge", 0, "compare_frame", 0], ["compare_frame", 0, "compare", 0],
    ["silk_label", 0, "silk_label_xform", 0], ["rubber_label", 0, "rubber_label_xform", 0], ["reinforced_label", 0, "reinforced_label_xform", 0], ["silk_label_xform", 0, "labels", 0], ["rubber_label_xform", 0, "labels", 1], ["reinforced_label_xform", 0, "labels", 2]
  ],
  "outputs": ["silk_rest", "silk_constraints", "silk_out", "rubber_rest", "rubber_constraints", "rubber_out", "reinforced_rest", "reinforced_constraints", "reinforced_out", "collider", "selected", "labels", "compare"],
  "meta": {
    "depends": [],
    "cook_budget": {"scope": "frame_range", "max_frames": 48, "max_points": 75000, "max_primitives": 75000, "max_memory_bytes": 536870912, "max_seconds": 90},
    "cache": {"format": ".bgeo.sc", "time_dependent": true, "write_implicit": false},
    "license": "houdini-apprentice-noncommercial",
    "verified_houdini_build": "22.0.368"
  }
}
