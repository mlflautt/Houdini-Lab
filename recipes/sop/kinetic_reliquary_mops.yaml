    {"id": "noise_transform", "type": "MOPS::Transform_Modifier::1.1", "name": "{{run_code}}_MOPS_NOISE_TRANSFORM", "exact_name": false, "role": "kinetic_mops_noise_transform", "position": [-2, -6], "params": {}, "expressions": {"rotatey": "$FF*8", "translatey": "$FF*0.02"}, "comment": "Noise-weighted lift and rotation"},
    {"id": "noise_color", "type": "color", "name": "{{run_code}}_MOPS_NOISE_COLOR", "role": "kinetic_mops_noise_color", "position": [-2, -8], "params": {"class": 2, "colortype": 0, "color": [0.8, 0.18, 1.0]}, "comment": "Candidate identity only"},
    {"id": "noise_attributes", "type": "attribcreate::2.0", "name": "{{run_code}}_MOPS_NOISE_ATTRIBUTES", "role": "kinetic_mops_noise_attribute_contract", "position": [-2, -10], "params": {"numattr": 3, "name1": "v", "class1": 2, "type1": 2, "size1": 3, "value1v1": 0.0, "value1v2": 0.48, "value1v3": 0.0, "name2": "seed", "class2": 2, "type2": 1, "size2": 1, "value2v1": "{{seed}}", "name3": "variant_id", "class3": 2, "type3": 3, "string3": "mops_noise"}, "comment": "Equivalent motion and provenance contract"},
