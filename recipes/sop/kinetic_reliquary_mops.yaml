    {"id": "shape_transform", "type": "MOPS::Transform_Modifier::1.1", "name": "{{run_code}}_MOPS_SHAPE_TRANSFORM", "exact_name": false, "role": "kinetic_mops_shape_transform", "position": [4, -6], "params": {}, "expressions": {"rotatez": "$FF*10", "translatey": "$FF*0.018"}, "comment": "Moving shape falloff reveals transform sequencing"},
    {"id": "shape_color", "type": "color", "name": "{{run_code}}_MOPS_SHAPE_COLOR", "role": "kinetic_mops_shape_color", "position": [4, -8], "params": {"class": 2, "colortype": 0, "color": [0.95, 0.82, 0.08]}, "comment": "Candidate identity only"},
