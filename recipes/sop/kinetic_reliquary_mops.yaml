    {"id": "selected", "type": "null", "name": "OUT_{{run_code}}_SELECTED", "role": "kinetic_selected_contract", "position": [0, -18], "params": {}, "comment": "Human selection only; alternatives remain"},
    {"id": "merge", "type": "merge", "name": "{{run_code}}_KINETIC_COMPARISON", "role": "kinetic_comparison_merge", "position": [5, -16], "params": {}, "comment": "Four equal-status motion candidates"},
