    {"id": "noise_visual_color", "type": "color", "name": "{{run_code}}_NOISE_VIS_COLOR", "role": "kinetic_mops_noise_visual_color", "position": [0, -18], "params": {"class": 2, "colortype": 0, "color": [0.8, 0.18, 1.0]}, "comment": "Noise comparison identity"},
    {"id": "shape_unpack", "type": "unpack", "name": "{{run_code}}_SHAPE_VIS_UNPACK", "role": "kinetic_mops_shape_visual_unpack", "position": [4, -16], "params": {}, "comment": "Presentation-only unpack after the verified packed shape contract"},
    {"id": "shape_visual_color", "type": "color", "name": "{{run_code}}_SHAPE_VIS_COLOR", "role": "kinetic_mops_shape_visual_color", "position": [4, -18], "params": {"class": 2, "colortype": 0, "color": [0.95, 0.82, 0.08]}, "comment": "Shape comparison identity"},

