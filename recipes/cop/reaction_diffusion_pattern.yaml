{
  "id": "cop.reaction_diffusion_pattern",
  "version": "1.0.0",
  "summary": "Build three deterministic native Gray-Scott Reaction-Diffusion candidates with color, human selection, contact sheet, and explicit ROP Image boundaries.",
  "contexts": ["COP"],
  "inputs": {
    "parent_path": {"type": "string"},
    "run_code": {"type": "string", "default": "REACTION_DIFFUSION"},
    "lineage": {"type": "string", "default": "native Copernicus reaction diffusion; Houdini 22.0.368"},
    "end_small_path": {"type": "string"},
    "end_large_path": {"type": "string"},
    "end_spots_path": {"type": "string"},
    "candidate_index": {"type": "integer", "min": 0, "max": 2, "default": 0},
    "iterations": {"type": "integer", "min": 1, "max": 12, "default": 8},
    "iterations_per_step": {"type": "integer", "min": 1, "max": 12, "default": 6},
    "noise_element_size": {"type": "number", "min": 0.01, "max": 1.0, "default": 0.12},
    "noise_offset_x": {"type": "number", "min": -1000.0, "max": 1000.0, "default": 0.0},
    "noise_offset_y": {"type": "number", "min": -1000.0, "max": 1000.0, "default": 0.0},
    "activation_threshold": {"type": "number", "min": 0.0, "max": 1.0, "default": 0.62},
    "activation_width": {"type": "number", "min": 0.0, "max": 0.5, "default": 0.03},
    "contact_scale": {"type": "number", "min": 0.25, "max": 1.0, "default": 1.0},
    "contact_output": {"type": "string"},
    "selected_output": {"type": "string"}
  },
  "references": {
    "sidefx_begin": "https://www.sidefx.com/docs/houdini/nodes/cop/reactiondiffusion_block_begin.html",
    "sidefx_end": "https://www.sidefx.com/docs/houdini/nodes/cop/reactiondiffusion_block_end.html",
    "sidefx_workflow": "https://www.sidefx.com/docs/houdini/copernicus/reaction_diffusion.html"
  },
  "nodes": [
    {
      "id": "activation_noise",
      "type": "fractalnoise",
      "name": "{{run_code}}_ACTIVATION_NOISE",
      "role": "reaction_activation_noise",
      "position": [-6.0, 12.0],
      "params": {
        "signature": "default",
        "amp": 0.5,
        "center": 0.5,
        "contrast": 0.15,
        "noisetype": "perlin",
        "elementsize": "{{noise_element_size}}",
        "offx": "{{noise_offset_x}}",
        "offy": "{{noise_offset_y}}",
        "fractaltype": "sharp",
        "oct": 4.0,
        "rough": 0.55,
        "post_doclampmin": 1,
        "post_minimum": 0.0,
        "post_doclampmax": 1,
        "post_maximum": 1.0
      },
      "comment": "{{lineage}}; shared deterministic high-contrast activation source"
    },
    {
      "id": "activation_threshold",
      "type": "remap",
      "name": "{{run_code}}_ACTIVATION_THRESHOLD",
      "role": "reaction_activation_mask",
      "position": [-6.0, 10.0],
      "params": {
        "signature": "auto",
        "op": "threshold",
        "side": "greater",
        "threshold": "{{activation_threshold}}",
        "width": "{{activation_width}}"
      },
      "comment": "{{lineage}}; sparse mono activation read only on the first solve step"
    },
    {
      "id": "begin_small",
      "type": "reactiondiffusion_block_begin",
      "name": "{{run_code}}_SMALL_WAVES_BEGIN",
      "role": "reaction_begin_smallwaves",
      "position": [-10.0, 8.0],
      "params": {"signature": "default", "blockpath": "{{end_small_path}}", "continuousactivation": 0},
      "comment": "{{lineage}}; native block begin paired explicitly with Small Waves end"
    },
    {
      "id": "end_small",
      "type": "reactiondiffusion_block_end",
      "name": "{{run_code}}_SMALL_WAVES",
      "role": "reaction_pattern_smallwaves",
      "position": [-10.0, 6.0],
      "params": {
        "signature": "default",
        "model": 0,
        "presetsgs": "smallwaves",
        "kill": 0.3865,
        "killraw": 0.051,
        "feed": 0.0899,
        "feedraw": 0.018,
        "gsdiffa": 1.0,
        "gsdiffb": 0.5,
        "simulate": 0,
        "iterations": "{{iterations}}",
        "iterationsperstep": "{{iterations_per_step}}",
        "continuouscook": 0,
        "cacheenabled": 0,
        "enableraw": 0,
        "normalize": 1,
        "post_doclampmin": 1,
        "post_minimum": 0.0,
        "post_doclampmax": 1,
        "post_maximum": 1.0
      },
      "comment": "{{lineage}}; Gray-Scott Small Waves; deterministic non-simulation mode"
    },
    {
      "id": "begin_large",
      "type": "reactiondiffusion_block_begin",
      "name": "{{run_code}}_LARGE_WAVES_BEGIN",
      "role": "reaction_begin_bigwaves",
      "position": [-6.0, 8.0],
      "params": {"signature": "default", "blockpath": "{{end_large_path}}", "continuousactivation": 0},
      "comment": "{{lineage}}; native block begin paired explicitly with Large Waves end"
    },
    {
      "id": "end_large",
      "type": "reactiondiffusion_block_end",
      "name": "{{run_code}}_LARGE_WAVES",
      "role": "reaction_pattern_bigwaves",
      "position": [-6.0, 6.0],
      "params": {
        "signature": "default",
        "model": 0,
        "presetsgs": "bigwaves",
        "kill": 0.0,
        "killraw": 0.045,
        "feed": 0.0444,
        "feedraw": 0.014,
        "gsdiffa": 1.0,
        "gsdiffb": 0.5,
        "simulate": 0,
        "iterations": "{{iterations}}",
        "iterationsperstep": "{{iterations_per_step}}",
        "continuouscook": 0,
        "cacheenabled": 0,
        "enableraw": 0,
        "normalize": 1,
        "post_doclampmin": 1,
        "post_minimum": 0.0,
        "post_doclampmax": 1,
        "post_maximum": 1.0
      },
      "comment": "{{lineage}}; Gray-Scott Large Waves; deterministic non-simulation mode"
    },
    {
      "id": "begin_spots",
      "type": "reactiondiffusion_block_begin",
      "name": "{{run_code}}_SPOTS_BEGIN",
      "role": "reaction_begin_spots",
      "position": [-2.0, 8.0],
      "params": {"signature": "default", "blockpath": "{{end_spots_path}}", "continuousactivation": 0},
      "comment": "{{lineage}}; native block begin paired explicitly with Spots end"
    },
    {
      "id": "end_spots",
      "type": "reactiondiffusion_block_end",
      "name": "{{run_code}}_SPOTS",
      "role": "reaction_pattern_spots",
      "position": [-2.0, 6.0],
      "params": {
        "signature": "default",
        "model": 0,
        "presetsgs": "spots",
        "kill": 0.8045,
        "killraw": 0.062,
        "feed": 0.2222,
        "feedraw": 0.03,
        "gsdiffa": 1.0,
        "gsdiffb": 0.5,
        "simulate": 0,
        "iterations": "{{iterations}}",
        "iterationsperstep": "{{iterations_per_step}}",
        "continuouscook": 0,
        "cacheenabled": 0,
        "enableraw": 0,
        "normalize": 1,
        "post_doclampmin": 1,
        "post_minimum": 0.0,
        "post_doclampmax": 1,
        "post_maximum": 1.0
      },
      "comment": "{{lineage}}; Gray-Scott Spots; deterministic non-simulation mode"
    },
    {
      "id": "color_small",
      "type": "monotorgb",
      "name": "{{run_code}}_COLOR_SMALL_WAVES",
      "role": "reaction_color_smallwaves",
      "position": [-10.0, 4.0],
      "params": {
        "inputmin": 0.0,
        "inputmax": 1.0,
        "outputmin": 0.0,
        "outputmax": 1.0,
        "ramp1cr": 0.01,
        "ramp1cg": 0.025,
        "ramp1cb": 0.08,
        "ramp2cr": 0.04,
        "ramp2cg": 0.9,
        "ramp2cb": 1.0
      },
      "comment": "{{lineage}}; cyan presentation ramp; mono pattern remains upstream"
    },
    {
      "id": "color_large",
      "type": "monotorgb",
      "name": "{{run_code}}_COLOR_LARGE_WAVES",
      "role": "reaction_color_bigwaves",
      "position": [-6.0, 4.0],
      "params": {
        "inputmin": 0.0,
        "inputmax": 1.0,
        "outputmin": 0.0,
        "outputmax": 1.0,
        "ramp1cr": 0.07,
        "ramp1cg": 0.01,
        "ramp1cb": 0.005,
        "ramp2cr": 1.0,
        "ramp2cg": 0.5,
        "ramp2cb": 0.025
      },
      "comment": "{{lineage}}; amber presentation ramp; mono pattern remains upstream"
    },
    {
      "id": "color_spots",
      "type": "monotorgb",
      "name": "{{run_code}}_COLOR_SPOTS",
      "role": "reaction_color_spots",
      "position": [-2.0, 4.0],
      "params": {
        "inputmin": 0.0,
        "inputmax": 1.0,
        "outputmin": 0.0,
        "outputmax": 1.0,
        "ramp1cr": 0.025,
        "ramp1cg": 0.0,
        "ramp1cb": 0.07,
        "ramp2cr": 0.65,
        "ramp2cg": 1.0,
        "ramp2cb": 0.16
      },
      "comment": "{{lineage}}; lime presentation ramp; mono pattern remains upstream"
    },
    {
      "id": "select",
      "type": "switch",
      "name": "{{run_code}}_SELECT_PATTERN",
      "role": "human_reaction_selector",
      "position": [-7.0, 2.0],
      "params": {"input": "{{candidate_index}}"},
      "comment": "{{lineage}}; human preview selection only; no winner implied"
    },
    {
      "id": "contactsheet",
      "type": "contactsheet",
      "name": "{{run_code}}_CONTACT_SHEET",
      "role": "reaction_contact_sheet",
      "position": [-3.0, 2.0],
      "params": {
        "stride": 3,
        "userows": 1,
        "limitlines": 1,
        "limitlinesnum": 1,
        "keepfullsize": 1,
        "stackhorizontal": "lefttoright",
        "scale": "{{contact_scale}}",
        "scaleinput": 1,
        "filter": "bilinear",
        "backgroundr": 0.0,
        "backgroundg": 0.0,
        "backgroundb": 0.0,
        "backgrounda": 1.0
      },
      "comment": "{{lineage}}; exact left-to-right order: Small Waves, Large Waves, Spots"
    },
    {
      "id": "selected_out",
      "type": "null",
      "name": "OUT_{{run_code}}_SELECTED",
      "role": "reaction_selected_pattern_contract",
      "position": [-7.0, 0.0],
      "params": {},
      "comment": "{{lineage}}; selected colored pattern; all alternatives remain connected"
    },
    {
      "id": "contact_out",
      "type": "null",
      "name": "OUT_{{run_code}}_CONTACT_SHEET",
      "role": "reaction_contact_sheet_contract",
      "position": [-3.0, 0.0],
      "params": {},
      "comment": "{{lineage}}; no-winner three-pattern comparison contract",
      "flags": {"display": true}
    },
    {
      "id": "selected_rop",
      "type": "rop_image",
      "name": "{{run_code}}_EXPORT_SELECTED",
      "role": "reaction_selected_export",
      "position": [-7.0, -2.0],
      "params": {
        "trange": "off",
        "copoutput": "{{selected_output}}",
        "docompile": 0,
        "colorconversion": "raw",
        "mkpath": 1,
        "initsim": 1,
        "savebackground": 0
      },
      "comment": "{{lineage}}; explicit non-overwriting selected PNG boundary"
    },
    {
      "id": "contact_rop",
      "type": "rop_image",
      "name": "{{run_code}}_EXPORT_CONTACT_SHEET",
      "role": "reaction_contact_sheet_export",
      "position": [-3.0, -2.0],
      "params": {
        "trange": "off",
        "copoutput": "{{contact_output}}",
        "docompile": 0,
        "colorconversion": "raw",
        "mkpath": 1,
        "initsim": 1,
        "savebackground": 0
      },
      "comment": "{{lineage}}; explicit non-overwriting contact-sheet PNG boundary"
    }
  ],
  "connections": [
    ["activation_noise", 0, "activation_threshold", 0],
    ["activation_threshold", 0, "begin_small", 0],
    ["activation_threshold", 0, "begin_large", 0],
    ["activation_threshold", 0, "begin_spots", 0],
    ["begin_small", 0, "end_small", 0],
    ["begin_large", 0, "end_large", 0],
    ["begin_spots", 0, "end_spots", 0],
    ["end_small", 0, "color_small", 0],
    ["end_large", 0, "color_large", 0],
    ["end_spots", 0, "color_spots", 0],
    ["color_small", 0, "select", 0],
    ["color_large", 0, "select", 1],
    ["color_spots", 0, "select", 2],
    ["color_small", 0, "contactsheet", 0],
    ["color_large", 0, "contactsheet", 1],
    ["color_spots", 0, "contactsheet", 2],
    ["select", 0, "selected_out", 0],
    ["contactsheet", 0, "contact_out", 0],
    ["selected_out", 0, "selected_rop", 0],
    ["contact_out", 0, "contact_rop", 0]
  ],
  "outputs": ["end_small", "end_large", "end_spots", "selected_out", "contact_out", "selected_rop", "contact_rop"],
  "meta": {
    "depends": [],
    "cook_budget": {
      "scope": "three_static_image_patterns",
      "max_resolution": [512, 512],
      "max_contact_resolution": [768, 256],
      "max_integration_steps_per_candidate": 48,
      "max_memory_bytes": 536870912,
      "max_seconds": 90
    },
    "cache": {"live_simulation": false, "frame_cache": false, "write_implicit": false},
    "license": "houdini-apprentice-noncommercial"
  }
}
