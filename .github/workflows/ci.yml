name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests (no Houdini)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest tests/unit -q
      - name: Ruff lint
        run: python -m ruff check .

  hython-tests:
    name: Hython Integration Tests (requires Houdini)
    runs-on: macos-latest
    # This job requires Houdini 22 on the runner. For now, skip if not available.
    if: false  # Set to true when runners have Houdini
    steps:
      - uses: actions/checkout@v6
      - name: Install pytest in Houdini Python
        run: |
          export PATH="/Applications/Houdini/Houdini22.0.368/Frameworks/Houdini.framework/Versions/22.0/Resources/bin:$PATH"
          hython -m pip install -q pytest
      - name: Run hython integration tests
        run: |
          export PATH="/Applications/Houdini/Houdini22.0.368/Frameworks/Houdini.framework/Versions/22.0/Resources/bin:$PATH"
          cd ${{ github.workspace }}
          hython -m pytest tests/hython -v
