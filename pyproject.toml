[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "houdini-creative-dev"
version = "0.23.0"
description = "Agentic Houdini development repo: bridge, recipes, HDAs, VEX templates, and skills for graph-first procedural creative work (Apprentice-aware)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Mitchell Flautt", email = "mlflautt@gmail.com" }]
keywords = ["houdini", "sidefx", "agentic-ai", "procedural", "creative-coding", "hou", "vex", "usd"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_houdini*", "bridge*", "recipes*", "skills", "skills._lib", "hda*"]
namespaces = false

[tool.setuptools.package-data]
recipes = ["sop/*.yaml", "lop/*.yaml", "cop/*.yaml", "top/*.yaml"]
skills = ["*/README.md", "*/skill.py", "*/skill.yaml"]
hda = ["source/*/manifest.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["hermes_houdini", "bridge", "skills", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
markers = [
    "hython: tests that require Houdini/hython on PATH",
]
